name: Documentation improvement
description: Suggest an improvement to the documentation content or website
title: "[Improvement]: "
labels:
  - enhancement

body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documentation content
        - New guide
        - Navigation
        - Search
        - Layout
        - Styling
        - Accessibility
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What could be improved?
      description: Describe the current limitation or friction.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Describe what you would change.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same suggestion.
          required: true
